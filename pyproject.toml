[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-island"
version = "1.1.0"
description = "Standalone Spotify Island helpers and Noctalia plugin"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["dbus-next>=0.2.3", "websockets>=14", "tomli-w>=1.0"]

[project.scripts]
spotify-island = "spotify_island.cli:main"
spotify-quick-control = "spotify_island.control:cli"
spotify-background-setup = "spotify_island.cli:setup_main"
spotify-island-mpris = "spotify_island.mpris:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spotify_island = ["plugins/spotify-island/*", "plugins/spotify-island/translations/*"]
